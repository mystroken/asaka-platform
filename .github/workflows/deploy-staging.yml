# Déploiement continu d'Asaka vers le staging (VPS serenihost).
#
# GitHub n'envoie aucun fichier : il transmet seulement le commit à déployer. La clé SSH est
# restreinte côté serveur (command= dans authorized_keys) à /srv/bin/deploy-asaka, qui récupère
# ce commit, reconstruit l'image Moodle si le thème a changé et copie le thème et le plugin
# WordPress. Voir docs/RUNBOOK.md du dépôt serenihost-server, section « Asaka (staging) ».
name: Deploy staging

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      init:
        description: "Réglages initiaux (thème Moodle, permaliens, URL du campus)"
        type: boolean
        default: false

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Préparer SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.STAGING_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Déployer
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          INIT: ${{ github.event.inputs.init == 'true' && ' --init' || '' }}
        run: ssh -o BatchMode=yes "${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }}" "${SHA}${INIT}"
