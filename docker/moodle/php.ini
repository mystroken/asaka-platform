; Réglages PHP requis ou recommandés par Moodle 5.x
max_input_vars = 5000
memory_limit = 512M
upload_max_filesize = 128M
post_max_size = 128M
max_execution_time = 300
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
; Dev : les fichiers montés sont relus à chaque requête.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
